<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="E-Calendar">
  <defs>
    <linearGradient id="ecalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ef6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ecalDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="64" height="64" rx="14" fill="url(#ecalBg)"/>

  <!-- binder rings (behind the page) -->
  <rect x="18.5" y="5" width="5" height="13" rx="2.5" fill="#dfe8ff"/>
  <rect x="40.5" y="5" width="5" height="13" rx="2.5" fill="#dfe8ff"/>

  <!-- calendar page -->
  <rect x="9" y="12" width="46" height="43" rx="9" fill="#ffffff"/>
  <path d="M9 21a9 9 0 0 1 9-9h28a9 9 0 0 1 9 9v3H9z" fill="#15286b"/>

  <!-- binder rings (in front of the header band) -->
  <rect x="18.5" y="7" width="5" height="11" rx="2.5" fill="#f4f7ff"/>
  <rect x="40.5" y="7" width="5" height="11" rx="2.5" fill="#f4f7ff"/>

  <!-- date grid -->
  <g fill="#c3d0e8">
    <rect x="15" y="30" width="7" height="6" rx="2"/>
    <rect x="26" y="30" width="7" height="6" rx="2"/>
    <rect x="37" y="30" width="7" height="6" rx="2"/>
    <rect x="15" y="41" width="7" height="6" rx="2"/>
    <rect x="37" y="41" width="7" height="6" rx="2"/>
  </g>

  <!-- highlighted "today" -->
  <rect x="25" y="40" width="9" height="8" rx="2.5" fill="url(#ecalDot)"/>
</svg>
